services:
  api:
    build: .
    container_name: fast-round-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      GIN_MODE: release
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      API_KEY: "${API_KEY:-change-me}"
      MAX_BODY_BYTES: 1048576
      READ_TIMEOUT: 5s
      WRITE_TIMEOUT: 5s
      IDLE_TIMEOUT: 60s
      SHUTDOWN_TIMEOUT: 10s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/fast-round-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: fast-round-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
